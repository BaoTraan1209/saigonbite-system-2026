<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaigonBite</title><link rel="stylesheet" href="/assets/css/app.css"></head>
<body><header><h1>SaigonBite</h1><p>Online Food Delivery Hub Platform</p></header>
<nav><button data-view="order">Place Order</button><button data-view="kitchen">Kitchen</button><button data-view="delivery">Delivery</button><button data-view="admin">Hub & Menu Admin</button><button data-view="reports">Reports</button></nav>
<main>
<section id="order" class="panel"><h2>UC3 – Place an Order</h2><form id="order-form"><label>Customer name<input name="customer_name" required></label><label>Phone<input name="customer_phone" required></label><label>Hub<select name="hub_id" id="hub-select" required></select></label><label>Brand<select name="brand_id" id="brand-select" required></select></label><div id="menu-list"></div><label>Delivery address<input name="delivery_address" required></label><label>Payment method<select name="payment_method"><option value="CASH_ON_DELIVERY">Cash on delivery</option><option value="CARD">Card</option><option value="ONLINE">Online</option></select></label><button type="submit">Confirm order</button></form><pre id="order-result"></pre></section>
<section id="kitchen" class="panel hidden"><h2>UC8 – Kitchen Orders</h2><button id="load-kitchen">Refresh queue</button><div id="kitchen-list"></div></section>
<section id="delivery" class="panel hidden"><h2>UC10 – Delivery</h2><button id="load-delivery">Refresh queue</button><div id="delivery-list"></div></section>
<section id="admin" class="panel hidden"><h2>UC13 / UC14 – Administration</h2><h3>Hubs</h3><div id="hub-admin-list"></div><h3>Create hub</h3><form id="hub-form"><input name="name" placeholder="Hub name" required><input name="address" placeholder="Address" required><input name="capacity" type="number" min="1" placeholder="Capacity" required><button>Create hub</button></form><h3>Brands and menu items</h3><div id="catalog-list"></div></section>
<section id="reports" class="panel hidden"><h2>UC16 – Management Reports</h2><button id="load-reports">Load reports</button><pre id="report-result"></pre></section>
</main><footer>SaigonBite RAD project – PHP / MySQL / JavaScript</footer><script type="module" src="/assets/js/app.js"></script></body></html>
